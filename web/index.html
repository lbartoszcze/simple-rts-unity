<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>simple-rts-unity — browser build</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>simple-rts</h1>
    <p>
      <b>Left-drag</b> to box-select your blue units.
      <b>Right-click on the ground</b> to move them in formation.
      <b>Right-click on a red enemy</b> to attack.
      Wipe out the red team to win.
    </p>
  </header>
  <canvas id="game" width="1024" height="640"></canvas>
  <div id="banner" class="hidden"></div>
  <script src="game.js"></script>
</body>
</html>
