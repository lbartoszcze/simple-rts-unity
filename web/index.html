<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>simple-rts — auto-battle roguelike</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hud">
      <span id="round-label">Round 1</span>
      <span id="score-label">0 wins</span>
      <span id="roster-label">— alive</span>
    </div>
    <div id="picks"></div>
    <div id="spells"></div>
    <div id="buildings"></div>
    <div id="round-toast"></div>
  </div>
  <div id="cardpicker" class="hidden">
    <h2 id="cardpicker-title">Victory — choose a blessing</h2>
    <div id="cards"></div>
  </div>
  <div id="banner" class="hidden"></div>
  <script type="module" src="game.js"></script>
</body>
</html>
